name: CI

on:
  push:
    branches: [ main, release/v* ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        required: false
        type: boolean
    outputs:
      version:
        description: NuGet package version computed by nbgv
        value: ${{ jobs.build.outputs.version }}

  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native_build:
    uses: ./.github/workflows/opa-native.yaml

  build:
    runs-on: ubuntu-latest
    needs: [ native_build ]
    timeout-minutes: 30
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '.config/dotnet-tools.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore Tools
      run: dotnet tool restore

    - name: Get Version
      id: get_version
      shell: pwsh
      run: |
        ./build/versions.ps1
        echo "version=$(dotnet nbgv get-version -v NuGetPackageVersion)" >> $env:GITHUB_OUTPUT

    - name: get_opa_lib
      uses: actions/download-artifact@v4
      with:
        name: opa-native
        path: ./src/Compilation/Interop/lib

    - name: Build
      run: dotnet build -c Release

    # Use the same OPA version the Interop native library is built against.
    - name: Download OPA CLI
      run: |
        OPA_CLI_VERSION=$(grep -oP 'github.com/open-policy-agent/opa \Kv[0-9.]+' ./src/Compilation/Interop/opa-native/go.mod)
        echo "Downloading OPA ${OPA_CLI_VERSION}"
        cd "$RUNNER_TEMP"
        curl -L --fail -O https://openpolicyagent.org/downloads/${OPA_CLI_VERSION}/opa_linux_amd64_static
        curl -L --fail -O https://openpolicyagent.org/downloads/${OPA_CLI_VERSION}/opa_linux_amd64_static.sha256
        sha256sum -c opa_linux_amd64_static.sha256
        sudo install -m 755 opa_linux_amd64_static /usr/local/bin/opa

    - name: Tests
      run: dotnet test --configuration Release --no-build --no-progress --filter-not-trait "Compiler=Interop" -- --coverage --coverage-output-format cobertura
      env:
        OPA_TEST_COMPILER: cli

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: test-results
        path: ./TestResults
        retention-days: 7

    - name: Merge Coverage
      run: dotnet coverage merge -o coveralls.xml -f cobertura ./TestResults/*.cobertura.xml

    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        file: coveralls.xml
        format: cobertura

    - name: Pack
      run: dotnet pack -c Release --no-build

    - uses: actions/upload-artifact@v4
      with:
        name: artifacts
        path: ./artifacts/package/release/*
        retention-days: 7
